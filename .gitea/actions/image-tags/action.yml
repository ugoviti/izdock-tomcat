name: image tags
description: Single source of truth for the image tag scheme (tags.sh), shared by build and promote

# 9.0.120      -> 9.0.120, 9.0, 9 [, 9.0.120-<build-number>] [, latest]
# 9.0.120-rc1  -> 9.0.120-rc1 [, 9.0.120-rc1-<build-number>]  (prerelease: never X.Y, X, latest)

inputs:
  images:
    description: Image name(s), newline separated
    required: true
  version:
    description: Version to tag (eg. 9.0.120)
    required: true
  latest:
    description: "'true' or 'false' (only applied to stable X.Y.Z versions)"
    default: 'false'
  build-number:
    description: Optional build number, adds the <version>-<build-number> tag
    default: ''

outputs:
  tags:
    description: Full image references, newline separated
    value: ${{ steps.tags.outputs.tags }}

runs:
  using: composite
  steps:
    - name: compute tags
      id: tags
      shell: bash
      env:
        IMAGES: ${{ inputs.images }}
        VERSION: ${{ inputs.version }}
        LATEST: ${{ inputs.latest }}
        BUILD_NUMBER: ${{ inputs.build-number }}
      run: |
        set -euo pipefail
        tags=$("$GITHUB_ACTION_PATH/tags.sh")
        printf '%s\n' "$tags"
        { echo "tags<<IMAGE_TAGS"; printf '%s\n' "$tags"; echo "IMAGE_TAGS"; } >> "$GITHUB_OUTPUT"
