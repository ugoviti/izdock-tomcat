# izdock/tomcat build and publish (Gitea Actions, replaces .drone.yml)
# On every push to master, every Monday (weekly rebuild: OS security updates of the
# apt upgrade layer, OS_UPDATE_STAMP=<ISO week>) and by hand (Repository > Actions > tomcat-build).
# One job per variant (Tomcat major), versions from versions.env (single source of truth):
#   1. build and push to the Gitea registry, then verify the image (.gitea/actions/build-push)
#   2. only if the verify passes: copy the same digest to Docker Hub (.gitea/actions/promote)
#   3. only if every variant was published on Docker Hub: gitleaks scan of the full history
#      (private rules), then push the built commit to GitHub master (fast-forward only).
#      GitHub is never pushed by hand: it gets only the commits of a release that passed.
# Tags (.gitea/actions/image-tags): X.Y.Z, X.Y, X, X.Y.Z-<run_number> [, latest on the 9 variant]
# To publish again an image already in the Gitea registry: tomcat-promote (manual).
#
# A commit message with [skip ci] starts no workflow (then run tomcat-build by hand).
#
# Setup: Settings > Actions of the repository or of the organization (shared by its repositories);
# a repository secret wins over the organization one with the same name.
#   REGISTRY_HOST       secret or variable  host of the private Gitea registry (no https://);
#                                           image <host>/initzero/tomcat (.gitea/actions/registry-login),
#                                           build cache in its buildcache-<variant> tags
#   REGISTRY_USERNAME   secret  Gitea user allowed to write the packages of the owner
#   REGISTRY_TOKEN      secret  Gitea token of that user, scope package: Read and Write
#   DOCKER_USERNAME     secret  Docker Hub user with write access to izdock/tomcat
#   DOCKER_PASSWORD     secret  Docker Hub personal access token, Read & Write
#   DOCKERHUB_README_TOKEN  secret, optional  Docker Hub personal access token, Read, Write, Delete:
#                           needed to update the repository description from README.md
#                           (.gitea/actions/dockerhub-readme); without it DOCKER_PASSWORD is tried
#   GH_PUSH_TOKEN       secret  GitHub fine-grained token, ugoviti/izdock-tomcat only, Contents: Read and write
#   MATRIX_PASSWORD     secret  password of the Matrix bot
#   MATRIX_HOMESERVER, MATRIX_ROOM_ID, MATRIX_USER   variables  Matrix homeserver URL, room id, bot user id
#   GITLEAKS_CONFIG     secret, optional  private gitleaks rules (TOML) extending the repository ones:
#                                           [extend] path = ".gitleaks.toml"
# Runner label: ubuntu-latest, with Docker. After every release the Docker Hub description is
# updated from README.md (github job); a failure there is reported (readme: in the Matrix notify)
# but does not fail the release.

name: tomcat-build

on:
  push:
    branches:
      - master
  schedule:
    # every Monday at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dockerhub:
        description: Also publish on Docker Hub (after the verify), then push the commit to GitHub
        type: boolean
        default: true

concurrency:
  group: tomcat-build
  cancel-in-progress: false

env:
  DOCKERHUB_IMAGE: izdock/tomcat
  PUBLIC_REPO_URL: https://github.com/ugoviti/izdock-tomcat.git
  PUBLIC_BRANCH: master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # add a variant: a TOMCAT<N>_* block in versions.env + REDISSON_TOMCAT<N>_SHA256 + a line here
          - variant: '9'
            latest: 'true'
          - variant: '10'
            latest: 'false'
    name: tomcat${{ matrix.variant }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build, push and verify
        id: build
        uses: ./.gitea/actions/build-push
        with:
          variant: ${{ matrix.variant }}
          latest: ${{ matrix.latest }}
          build-number: ${{ gitea.run_number }}
          registry-host: ${{ secrets.REGISTRY_HOST || vars.REGISTRY_HOST }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.REGISTRY_TOKEN }}

      - name: login docker hub
        id: hub
        if: github.event_name != 'workflow_dispatch' || inputs.dockerhub == true || inputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: promote to docker hub
        if: steps.hub.outcome == 'success'
        uses: ./.gitea/actions/promote
        with:
          source: ${{ steps.build.outputs.image }}:${{ steps.build.outputs.source-tag }}
          version: ${{ steps.build.outputs.version }}
          latest: ${{ matrix.latest }}
          build-number: ${{ gitea.run_number }}
          dockerhub-image: ${{ env.DOCKERHUB_IMAGE }}

      - name: matrix notify
        if: always()
        uses: ./.gitea/actions/matrix-notify
        with:
          status: ${{ job.status }}
          label: tomcat${{ matrix.variant }} ${{ steps.build.outputs.version || '?' }} (${{ github.event_name }}) dockerhub:${{ steps.hub.outcome == 'success' && 'yes' || 'no' }}
          password: ${{ secrets.MATRIX_PASSWORD }}
          homeserver: ${{ vars.MATRIX_HOMESERVER }}
          room-id: ${{ vars.MATRIX_ROOM_ID }}
          user: ${{ vars.MATRIX_USER }}

  # the release passed (every variant built, verified and on Docker Hub): publish the code
  github:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.dockerhub == true || inputs.dockerhub == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: ./.gitea/actions/gitleaks
        with:
          config: ${{ secrets.GITLEAKS_CONFIG }}

      # once per release, after every variant is on Docker Hub
      - name: docker hub readme
        id: readme
        continue-on-error: true
        uses: ./.gitea/actions/dockerhub-readme
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          token: ${{ secrets.DOCKERHUB_README_TOKEN || secrets.DOCKER_PASSWORD }}
          repository: ${{ env.DOCKERHUB_IMAGE }}

      - name: push to github
        env:
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          set -eu
          AUTH=$(printf 'x-access-token:%s' "$GH_PUSH_TOKEN" | base64 -w0)
          # fast-forward only (no force): GitHub rejects a commit that does not contain its master
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push "$PUBLIC_REPO_URL" "${GITHUB_SHA}:refs/heads/${PUBLIC_BRANCH}"

      - name: matrix notify
        if: always()
        uses: ./.gitea/actions/matrix-notify
        with:
          status: ${{ job.status }}
          label: github push ${{ env.PUBLIC_BRANCH }} readme:${{ steps.readme.outcome || 'skipped' }}
          password: ${{ secrets.MATRIX_PASSWORD }}
          homeserver: ${{ vars.MATRIX_HOMESERVER }}
          room-id: ${{ vars.MATRIX_ROOM_ID }}
          user: ${{ vars.MATRIX_USER }}
